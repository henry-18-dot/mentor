<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <title>示例页面（自造）</title>
  <style>h1 { color: red; }</style>
</head>
<body>
  <script>var hidden = "这段脚本文字不该进正文";</script>
  <h1>示例 HTML 讲义</h1>

  <h2>第一节</h2>
  <p>第一节的正文。</p>
  <ul>
    <li>列表项一。</li>
    <li>列表项二。</li>
  </ul>
  <h2>第二节</h2>
  <p>第二节的正文，节名应该换过来。</p>
</body>
</html>
